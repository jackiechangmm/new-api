name: new-api-preview

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-5174}:80"
    volumes:
      - ./Caddyfile.preview:/etc/caddy/Caddyfile:ro
    depends_on:
      new-api:
        condition: service_healthy
    networks:
      - preview-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api-preview:local
    volumes:
      - preview_data:/data
    env_file:
      - path: .env.preview
        required: false
    environment:
      SQL_DSN: postgresql://root:123456@postgres:5432/new-api
      REDIS_CONN_STRING: redis://redis
      TZ: Asia/Shanghai
      BATCH_UPDATE_ENABLED: "true"
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - preview-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks:
      - preview-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - preview_pg_data:/var/lib/postgresql/data
    networks:
      - preview-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  preview_data:
  preview_pg_data:

networks:
  preview-network:
    driver: bridge
