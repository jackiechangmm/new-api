name: 构建并发布 GHCR 候选镜像

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要构建的分支，例如 bululu-main"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: 准备镜像标签
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出分支
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: 解析镜像标签
        id: version
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          TAG_PREFIX=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          TAG_PREFIX=${TAG_PREFIX:0:105}
          TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | sed -E 's/[.-]+$//')
          if [ -z "$TAG_PREFIX" ]; then
            echo "::error::分支名无法转换为 Docker 标签"
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${TAG_PREFIX}-$(date +'%Y%m%d')-${SHORT_SHA}"
          {
            echo "sha=$SHA"
            echo "tag_prefix=$TAG_PREFIX"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 构建并推送 (amd64)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 检出目标提交
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: 写入版本
        run: echo "${{ needs.prepare.outputs.version }}" > VERSION

      - name: 登录 GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/new-api:${{ needs.prepare.outputs.tag_prefix }}
            ghcr.io/${{ github.repository_owner }}/new-api:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/new-api:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: 使用 digest 签名
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 签名镜像
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/new-api@${{ steps.build.outputs.digest }}
