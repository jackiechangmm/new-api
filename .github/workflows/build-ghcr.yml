name: 构建并发布正式 GHCR 镜像

on:
  push:
    tags:
      - 'bululu-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 bululu-main 正式标签，例如 bululu-v2026.08.18"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 构建正式镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 检出正式标签
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: 解析版本
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            bululu-v*) ;;
            *) echo "::error::正式标签必须以 bululu-v 开头"; exit 1 ;;
          esac
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::$RELEASE_TAG 不是正式 Git 标签"
            exit 1
          fi
          SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$SHA" origin/bululu-main; then
            echo "::error::$RELEASE_TAG 不属于 bululu-main 历史"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_TAG" > VERSION

      - name: 登录 GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/new-api:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/new-api:${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: 使用 digest 签名
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 签名镜像
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/new-api@${{ steps.build.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/new-api:${{ inputs.tag || github.ref_name }}
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/new-api:${{ steps.version.outputs.sha }}
